version: "3.9"

services:
  db:
    image: postgres:16
    container_name: smartchef_db
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      # chỉ cần local debug, khi lên VPS có thể bỏ
      - "5432:5432"

  web:
    build: .
    container_name: smartchef_web
    restart: always
    depends_on:
      - db
    env_file:
      - .env
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000
    ports:
      - "8000:8000"
    volumes:
      - .:/app

volumes:
  postgres_data:
